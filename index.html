<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Streaming</title>
    <style>
        body {
            background-color: transparent;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        .dashboard-container {
            display: flex;
            gap: 30px;
            background: rgba(18, 18, 18, 0.85);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }
        .gauge-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        h2 { font-size: 1.2rem; margin-bottom: 5px; }
        .sub-title { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; }
        
        /* Contenedor del medidor circular */
        .gauge-container {
            position: relative;
            width: 160px;
            height: 80px;
            margin: 15px auto 10px auto;
            overflow: hidden;
        }
        .gauge-bg, .gauge-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            box-sizing: border-box;
            border: 18px solid #2a2a2a;
        }
        .gauge-fill {
            border-color: #00ffcc;
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            transform: rotate(-180deg);
            transition: transform 0.8s ease-in-out;
        }
        .gauge-text {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .error-msg {
            color: #ff4d4d;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 10px;
        }
    </style>
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="appContainer">
        <div class="dashboard-container" id="dashboard" style="display: none;">
            
            <!-- Medidor de Tokens Totales -->
            <div class="gauge-card">
                <h2 id="nombreUsuario">Tokens</h2>
                <div class="sub-title" id="infoMeta">Meta: 0</div>
                <div class="gauge-container">
                    <div class="gauge-bg"></div>
                    <div class="gauge-fill" id="tokenFill"></div>
                    <div class="gauge-text" id="tokenText">0 / 0</div>
                </div>
            </div>

            <!-- Medidor de Meta Diaria -->
            <div class="gauge-card">
                <h2>Meta Diaria</h2>
                <div class="sub-title" id="infoMetaDiaria">Diaria: 0</div>
                <div class="gauge-container">
                    <div class="gauge-bg"></div>
                    <div class="gauge-fill" id="dailyFill" style="border-color: #f39c12;"></div>
                    <div class="gauge-text" id="dailyText">0 / 0</div>
                </div>
            </div>

            <!-- Medidor de Horas -->
            <div class="gauge-card">
                <h2>Horas Acumuladas</h2>
                <div class="sub-title">Escala Máxima: 150h</div>
                <div class="gauge-container">
                    <div class="gauge-bg"></div>
                    <div class="gauge-fill" id="hourFill" style="border-color: #9b59b6;"></div>
                    <div class="gauge-text" id="hourText">0h / 150h</div>
                </div>
            </div>

        </div>

        <div id="errorBox" class="error-msg" style="display: none;">
            Falta el ?id=usuario en el enlace de OBS
        </div>
    </div>

    <!-- Audios -->
    <audio id="audioToken" src="ficha.mp3"></audio>
    <audio id="audioGuau" src="guau.mp3"></audio>
    <audio id="audioMeta" src="meta.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTldVwHQUWlQyW2jNV8wOc_qZpFB5hPPQ",
            authDomain: "medidor-tokens-dffe1.firebaseapp.com",
            databaseURL: "https://medidor-tokens-dffe1-default-rtdb.firebaseio.com",
            projectId: "medidor-tokens-dffe1",
            storageBucket: "medidor-tokens-dffe1.firebasestorage.app",
            messagingSenderId: "895942296701",
            appId: "1:895942296701:web:1f1fe6075732a2d2b0dd14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        const dashboard = document.getElementById('dashboard');
        const errorBox = document.getElementById('errorBox');

        if (!userId) {
            errorBox.style.display = 'block';
        } else {
            dashboard.style.display = 'flex';
            
            const userRef = ref(db, 'usuarios/' + userId);
            let prevTokens = null;
            let milestone50 = false;
            let milestone100 = false;

            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('nombreUsuario').innerText = "Usuario no existe";
                    return;
                }

                const nombre = data.nombre || userId;
                const tokens = Number(data.tokens || 0);
                const meta = Number(data.meta || 1000);
                const metaDiaria = Number(data.metaDiaria || 200);
                const tokensDiarios = Number(data.tokensDiarios || 0);
                const horas = Number(data.horas || 0);

                // Textos
                document.getElementById('nombreUsuario').innerText = nombre;
                document.getElementById('infoMeta').innerText = `Meta Total: ${meta}`;
                document.getElementById('infoMetaDiaria').innerText = `Meta Diaria: ${metaDiaria}`;

                // --- GAUGE TOKEN ---
                document.getElementById('tokenText').innerText = `${tokens} / ${meta}`;
                let tokenPct = Math.min(tokens / meta, 1);
                let tokenDeg = -180 + (tokenPct * 180);
                document.getElementById('tokenFill').style.transform = `rotate(${tokenDeg}deg)`;

                // --- GAUGE DIARIO ---
                document.getElementById('dailyText').innerText = `${tokensDiarios} / ${metaDiaria}`;
                let dailyPct = Math.min(tokensDiarios / metaDiaria, 1);
                let dailyDeg = -180 + (dailyPct * 180);
                document.getElementById('dailyFill').style.transform = `rotate(${dailyDeg}deg)`;

                // --- GAUGE HORAS ---
                document.getElementById('hourText').innerText = `${horas}h / 150h`;
                let hourPct = Math.min(horas / 150, 1);
                let hourDeg = -180 + (hourPct * 180);
                document.getElementById('hourFill').style.transform = `rotate(${hourDeg}deg)`;

                // Lógica de Sonidos y Hitos (Tokens Totales)
                if (prevTokens !== null && tokens > prevTokens) {
                    document.getElementById('audioToken').play().catch(e => {});

                    if (tokens >= (meta * 0.5) && !milestone50 && tokens < meta) {
                        milestone50 = true;
                        document.getElementById('audioGuau').play().catch(e => {});
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }

                    if (tokens >= meta && !milestone100) {
                        milestone100 = true;
                        document.getElementById('audioMeta').play().catch(e => {});
                        confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
                    }
                }
                prevTokens = tokens;
            });
        }
    </script>
</body>
</html>
